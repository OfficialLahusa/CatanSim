name: Tests

on:
  push:
  pull_request:

jobs:
  dotnet:
    name: C# test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # The value net is not tracked in git, so its tests are skipped here
      - run: dotnet test Tests/Tests.csproj --logger "console;verbosity=normal"

  python:
    name: Python vectorizer tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pyyaml rich scikit-learn
      # CPU torch and the training packages, pinned to the training environment, for the ONNX export, training,
      # augmented dataset and baseline layout tests
      - run: pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install lightning==2.6.5 onnxruntime==1.28.0 onnx==1.22.0
      - run: python -m unittest discover -s Tests/Python -v
